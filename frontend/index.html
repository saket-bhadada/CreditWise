<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CreditWise — Explainable Credit Risk & Macroeconomic Stress Testing</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: #f4f6f9;
        color: #1e293b;
        line-height: 1.5;
        font-size: 14px;
      }
      .app-header {
        background-color: #0f172a;
        color: #ffffff;
        padding: 14px 24px;
        border-bottom: 3px solid #2563eb;
      }
      .app-header h1 {
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 0.2px;
      }
      .app-header p {
        font-size: 12px;
        color: #94a3b8;
        margin-top: 2px;
      }
      .nav-bar {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        background-color: #1e293b;
        padding: 8px 24px;
        border-bottom: 1px solid #334155;
      }
      .nav-btn {
        background-color: transparent;
        color: #cbd5e1;
        border: 1px solid transparent;
        padding: 7px 14px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 13px;
        font-weight: 500;
      }
      .nav-btn:hover {
        background-color: #334155;
        color: #ffffff;
      }
      .nav-btn.active {
        background-color: #2563eb;
        color: #ffffff;
        font-weight: 600;
      }
      .main-container {
        max-width: 1360px;
        margin: 0 auto;
        padding: 20px 24px 48px 24px;
      }
      .card {
        background: #ffffff;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        padding: 18px;
        margin-bottom: 18px;
      }
      .card-title {
        font-size: 15px;
        font-weight: 700;
        color: #0f172a;
        margin-bottom: 12px;
        padding-bottom: 8px;
        border-bottom: 1px solid #e2e8f0;
      }
      .grid-2 {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(420px, 1fr));
        gap: 18px;
      }
      .grid-3 {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 16px;
      }
      .grid-4 {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
        gap: 14px;
      }
      .metric-box {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-left: 4px solid #2563eb;
        border-radius: 4px;
        padding: 12px 14px;
      }
      .metric-box.danger {
        border-left-color: #dc2626;
      }
      .metric-box.success {
        border-left-color: #16a34a;
      }
      .metric-box.warning {
        border-left-color: #d97706;
      }
      .metric-label {
        font-size: 11px;
        text-transform: uppercase;
        color: #64748b;
        font-weight: 600;
      }
      .metric-value {
        font-size: 21px;
        font-weight: 700;
        color: #0f172a;
        margin-top: 4px;
      }
      .metric-sub {
        font-size: 12px;
        color: #475569;
        margin-top: 2px;
      }
      table.data-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }
      table.data-table th,
      table.data-table td {
        border: 1px solid #e2e8f0;
        padding: 8px 10px;
        text-align: left;
      }
      table.data-table th {
        background-color: #f1f5f9;
        color: #334155;
        font-weight: 600;
      }
      table.data-table tr:nth-child(even) {
        background-color: #f8fafc;
      }
      .form-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 12px;
      }
      .form-group {
        display: flex;
        flex-direction: column;
      }
      .form-group label {
        font-size: 12px;
        font-weight: 600;
        color: #334155;
        margin-bottom: 4px;
      }
      .form-group input,
      .form-group select {
        padding: 7px 9px;
        border: 1px solid #cbd5e1;
        border-radius: 4px;
        font-size: 13px;
        background: #ffffff;
      }
      .btn {
        background-color: #2563eb;
        color: #ffffff;
        border: none;
        padding: 9px 16px;
        border-radius: 4px;
        font-weight: 600;
        font-size: 13px;
        cursor: pointer;
      }
      .btn:hover {
        background-color: #1d4ed8;
      }
      .btn-secondary {
        background-color: #475569;
      }
      .btn-secondary:hover {
        background-color: #334155;
      }
      .btn-danger {
        background-color: #dc2626;
      }
      .alert-box {
        padding: 12px 14px;
        border-radius: 4px;
        margin-bottom: 16px;
        font-size: 13px;
        border: 1px solid;
      }
      .alert-warning {
        background-color: #fffbeb;
        border-color: #f59e0b;
        color: #92400e;
      }
      .alert-danger {
        background-color: #fef2f2;
        border-color: #ef4444;
        color: #991b1b;
      }
      .alert-info {
        background-color: #eff6ff;
        border-color: #3b82f6;
        color: #1e40af;
      }
      .badge {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 4px;
        font-size: 11px;
        font-weight: 700;
      }
      .badge-macro {
        background-color: #dbeafe;
        color: #1e40af;
      }
      .badge-borrower {
        background-color: #e2e8f0;
        color: #334155;
      }
      .badge-high {
        background-color: #fee2e2;
        color: #991b1b;
      }
      .badge-low {
        background-color: #dcfce7;
        color: #166534;
      }
      .formula-banner {
        font-family: "Courier New", Courier, monospace;
        background: #0f172a;
        color: #38bdf8;
        padding: 12px 16px;
        border-radius: 4px;
        font-size: 16px;
        font-weight: 700;
        margin-bottom: 14px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
